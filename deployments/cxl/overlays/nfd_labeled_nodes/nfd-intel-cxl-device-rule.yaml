apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-cxl-device-rule
spec:
  rules:
    - name: "intel.cxl"
      labels:
        "intel.feature.node.kubernetes.io/cxl": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            # TODO: delete or replace with real IDs.
            vendor: {op: In, value: ["1da3"]}
            device: {op: In, value: ["1020", "1030"]}
