# Two pods that share a devdax slice of a CXL memory device attached to
# their node (a 64Mi request, rounded up to the memory block size: 128Mi
# with 128 MiB blocks). The slice belongs to one ResourceClaim (DeviceClass
# cxl-local-dax, device-classes.yaml) that both pods reference: the
# scheduler puts them on the node of the claim's device, and kubelet
# prepares the claim once, so both containers get the same /dev/daxX.Y
# (path in CXL_LOCAL_DAX_<SERIAL>, size in CXL_LOCAL_SIZE_<SERIAL>).
#
# The writer writes a message at offset 0, the reader prints what it
# finds there.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: local-dax-slice
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-local-dax
        capacity:
          requests:
            memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: local-dax-writer
spec:
  containers:
  - name: writer
    image: docker.io/library/python:3-alpine
    command:
    - python3
    - -u
    - -c
    - |
      import mmap, os, time
      dax = [v for k, v in os.environ.items() if k.startswith("CXL_LOCAL_DAX_")][0]
      size = int([v for k, v in os.environ.items() if k.startswith("CXL_LOCAL_SIZE_")][0])
      fd = os.open(dax, os.O_RDWR)
      # devdax needs MAP_SHARED and a mapping aligned to the device alignment
      m = mmap.mmap(fd, size, mmap.MAP_SHARED, mmap.PROT_READ | mmap.PROT_WRITE)
      msg = b"hello from local-dax-writer\0"
      m[0:len(msg)] = msg
      print("wrote to", dax)
      time.sleep(1e9)
    resources:
      claims:
      - name: mem
  resourceClaims:
  - name: mem
    resourceClaimName: local-dax-slice
---
apiVersion: v1
kind: Pod
metadata:
  name: local-dax-reader
spec:
  containers:
  - name: reader
    image: docker.io/library/python:3-alpine
    command:
    - python3
    - -u
    - -c
    - |
      import mmap, os, time
      dax = [v for k, v in os.environ.items() if k.startswith("CXL_LOCAL_DAX_")][0]
      size = int([v for k, v in os.environ.items() if k.startswith("CXL_LOCAL_SIZE_")][0])
      fd = os.open(dax, os.O_RDWR)
      m = mmap.mmap(fd, size, mmap.MAP_SHARED, mmap.PROT_READ | mmap.PROT_WRITE)
      while True:
          print("read from", dax + ":", bytes(m[0:4096]).split(b"\0", 1)[0].decode(errors="replace"))
          time.sleep(10)
    resources:
      claims:
      - name: mem
  resourceClaims:
  - name: mem
    resourceClaimName: local-dax-slice
