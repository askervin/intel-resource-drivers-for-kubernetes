# A pod that maps a shared CXL memory device of a memory pool. The same
# device can be attached to several nodes (one claim per node), and every
# node sees the same bytes. kubelet-cxl-plugin gives the container the
# devdax device node and its path in CXL_SHARED_DAX_<SERIAL>.
#
# The container writes MESSAGE at offset 0 if it is set, then prints the
# string at offset 0. Run it on another node (or in another cluster
# sharing the pool) without MESSAGE to read what the first one wrote.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: shared-memory
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-shared-memory
        selectors:
        - cel:
            expression: 'device.attributes["cxl-pool.generic"].serial == "0xc1ae0001"'
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-consumer
spec:
  containers:
  - name: consumer
    image: docker.io/library/python:3-alpine
    env:
    - name: MESSAGE
      value: "hello from shared-consumer"
    command:
    - python3
    - -u
    - -c
    - |
      import mmap, os, time
      dax = [v for k, v in os.environ.items() if k.startswith("CXL_SHARED_DAX_")][0]
      size = int([v for k, v in os.environ.items() if k.startswith("CXL_SHARED_SIZE_")][0])
      fd = os.open(dax, os.O_RDWR)
      # devdax needs MAP_SHARED and a mapping aligned to the device alignment
      m = mmap.mmap(fd, size, mmap.MAP_SHARED, mmap.PROT_READ | mmap.PROT_WRITE)
      msg = os.environ.get("MESSAGE", "")
      if msg:
          data = msg.encode() + b"\0"
          m[0:len(data)] = data
          print("wrote:", msg)
      print("read: ", bytes(m[0:4096]).split(b"\0", 1)[0].decode(errors="replace"))
      m.close()
      os.close(fd)
      time.sleep(1e9)
    resources:
      claims:
      - name: mem
  resourceClaims:
  - name: mem
    resourceClaimName: shared-memory
