# DeviceClasses for CXL memory devices of a memory pool, published by a
# pool controller under the driver cxl-pool.generic. See doc/cxl/POOL.md.
#
# cxl-pool-memory: exclusive devices, onlined as system RAM (a new NUMA
# node) on the node that the scheduler picked.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: cxl-pool-memory
spec:
  selectors:
  - cel:
      expression: 'device.driver == "cxl-pool.generic" && device.attributes["cxl-pool.generic"].shared == false'
---
# cxl-shared-memory: shared devices, attached to several nodes at once and
# exposed to containers as a devdax character device (/dev/daxX.Y).
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: cxl-shared-memory
spec:
  selectors:
  - cel:
      expression: 'device.driver == "cxl-pool.generic" && device.attributes["cxl-pool.generic"].shared == true'
