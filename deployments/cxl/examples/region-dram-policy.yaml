# Steering of a container to DRAM first, then to the CXL NUMA node of a
# region that existed before the driver: 64Mi of DeviceClass cxl-dram and
# 64Mi of cxl-region, and a MemoryPolicyConfig with memoryUseOrder
# first-dram. The container prints its CXL_* environment and its
# cpuset.mems.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: region-dram-policy
spec:
  devices:
    requests:
    - name: dram
      exactly:
        deviceClassName: cxl-dram
        capacity:
          requests:
            memory: 64Mi
    - name: cxl
      exactly:
        deviceClassName: cxl-region
        capacity:
          requests:
            memory: 64Mi
    config:
    - opaque:
        driver: cxl.generic
        parameters:
          apiVersion: cxl.generic/v1alpha1
          kind: MemoryPolicyConfig
          memoryUseOrder: first-dram
---
apiVersion: v1
kind: Pod
metadata:
  name: region-dram-policy
spec:
  resourceClaims:
  - name: mem
    resourceClaimName: region-dram-policy
  containers:
  - name: app
    image: docker.io/library/python:3-alpine
    command: ["sh", "-c", "env | grep ^CXL_ | sort; echo cpuset.mems: $(cat /sys/fs/cgroup/cpuset.mems.effective); sleep infinity"]
    resources:
      claims:
      - name: mem
