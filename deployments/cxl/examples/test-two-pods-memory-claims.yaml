apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: cxl-memory-claim-1
spec:
  devices:
    requests:
    - name: cxl-memory
      exactly:
        deviceClassName: cxl.intel.com
        count: 10  # Request 10 chunks of 2MB = 20MB
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: cxl-memory-claim-2
spec:
  devices:
    requests:
    - name: cxl-memory
      exactly:
        deviceClassName: cxl.intel.com
        count: 5  # Request 5 chunks of 2MB = 10MB
---
apiVersion: v1
kind: Pod
metadata:
  name: test-cxl-pod-1
spec:
  restartPolicy: Never
  containers:
  - name: with-cxl-memory
    image: registry.k8s.io/e2e-test-images/busybox:1.29-2
    command: ["sh", "-c", "echo 'Pod 1 with 20MB CXL memory' && numactl --hardware && free -m && sleep 300"]
    resources:
      claims:
      - name: cxl-memory-resource
  resourceClaims:
  - name: cxl-memory-resource
    resourceClaimName: cxl-memory-claim-1
---
apiVersion: v1
kind: Pod
metadata:
  name: test-cxl-pod-2
spec:
  restartPolicy: Never
  containers:
  - name: with-cxl-memory
    image: registry.k8s.io/e2e-test-images/busybox:1.29-2
    command: ["sh", "-c", "echo 'Pod 2 with 10MB CXL memory' && numactl --hardware && free -m && sleep 300"]
    resources:
      claims:
      - name: cxl-memory-resource
  resourceClaims:
  - name: cxl-memory-resource
    resourceClaimName: cxl-memory-claim-2
