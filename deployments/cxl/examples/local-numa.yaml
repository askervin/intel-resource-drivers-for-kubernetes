# 128Mi of a CXL memory device attached to the node, as RAM of the
# device's NUMA node (DeviceClass cxl-local, ../device-classes.yaml). The
# container is steered to that node: it is in its cpuset.mems. It prints
# its CXL_* environment (CXL_<KEY>_NODE is the node) and cpuset.mems.
# A selector picks a specific device:
#   device.attributes["cxl.generic"].serial == "0xc100e2e1"
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: local-numa
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-local
        capacity:
          requests:
            memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: local-numa
spec:
  resourceClaims:
  - name: mem
    resourceClaimName: local-numa
  containers:
  - name: app
    image: docker.io/library/python:3-alpine
    command: ["sh", "-c", "env | grep ^CXL_ | sort; echo cpuset.mems: $(cat /sys/fs/cgroup/cpuset.mems.effective); sleep infinity"]
    resources:
      claims:
      - name: mem
