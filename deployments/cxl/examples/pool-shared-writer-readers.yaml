# Single-writer data sharing with a shared device of a memory pool
# (DeviceClass cxl-pool-shared): the writer's claim requests all hosts of
# the device (4 in the ResourceSlice of the reference pool controller), so
# that no other claim gets the device while it exists; readers created
# meanwhile stay pending. The readers join with one host each and
# DeviceConfig readOnly: true: their device node allows reads only.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: shared-writer
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-pool-shared
        selectors:
        - cel:
            expression: 'device.attributes["cxl-pool.generic"].serial == "0xc1ae0001"'
        capacity:
          requests:
            hosts: "4"     # all of them: exclusive
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-writer
spec:
  restartPolicy: Never
  resourceClaims:
  - name: mem
    resourceClaimName: shared-writer
  containers:
  - name: writer
    image: docker.io/library/python:3-alpine
    command:
    - python3
    - -u
    - -c
    - |
      import mmap, os
      key = [k[:-len("DAX")] for k in os.environ if k.startswith("CXL_") and k.endswith("_DAX")][0]
      dax, size = os.environ[key + "DAX"], int(os.environ[key + "SIZE"])
      m = mmap.mmap(os.open(dax, os.O_RDWR), size, mmap.MAP_SHARED, mmap.PROT_READ | mmap.PROT_WRITE)
      m[0:6] = b"hello\0"
      print("wrote: hello")
    resources:
      claims:
      - name: mem
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: shared-reader
spec:
  spec:
    devices:
      requests:
      - name: mem
        exactly:
          deviceClassName: cxl-pool-shared
          selectors:
          - cel:
              expression: 'device.attributes["cxl-pool.generic"].serial == "0xc1ae0001"'
      config:
      - opaque:
          driver: cxl-pool.generic
          parameters:
            apiVersion: cxl-pool.generic/v1alpha1
            kind: DeviceConfig
            readOnly: true
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-reader
spec:
  resourceClaims:
  - name: mem
    resourceClaimTemplateName: shared-reader
  containers:
  - name: reader
    image: docker.io/library/python:3-alpine
    command:
    - python3
    - -u
    - -c
    - |
      import mmap, os, time
      key = [k[:-len("DAX")] for k in os.environ if k.startswith("CXL_") and k.endswith("_DAX")][0]
      dax, size = os.environ[key + "DAX"], int(os.environ[key + "SIZE"])
      m = mmap.mmap(os.open(dax, os.O_RDONLY), size, mmap.MAP_SHARED, mmap.PROT_READ)
      print("read:", bytes(m[0:4096]).split(b"\0", 1)[0].decode(errors="replace"))
      try:
          os.open(dax, os.O_RDWR)
      except PermissionError as e:
          print("open for writing refused:", e)
      time.sleep(1e9)
    resources:
      claims:
      - name: mem
